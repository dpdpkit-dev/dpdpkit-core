[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dpdpkit-core"
dynamic = ["version"]
description = "Rules engine, consent ledger, rights, retention and CLI for India's DPDP Act and Rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dpdpkit maintainers" }]
keywords = ["dpdp", "privacy", "consent", "india", "data-protection", "gdpr"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6.0",
  "dpdpkit-policies>=2026.10.0a1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-pyyaml"]

[project.scripts]
dpdpkit = "dpdpkit.cli:main"

[project.urls]
Homepage = "https://github.com/dpdpkit-dev/dpdpkit-core"
Documentation = "https://dpdpkit.dev"
Changelog = "https://github.com/dpdpkit-dev/dpdpkit-core/blob/main/CHANGELOG.md"
Issues = "https://github.com/dpdpkit-dev/dpdpkit-core/issues"

[tool.hatch.version]
path = "src/dpdpkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dpdpkit"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["meta"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "BLE"]
ignore = ["S101", "BLE001", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:dpdpkit.*"]

[tool.coverage.run]
source = ["dpdpkit"]
branch = true
